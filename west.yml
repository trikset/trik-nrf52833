manifest:
  remotes:
    - name: nrfconnect
      url-base: https://github.com/nrfconnect

  projects:
    - name: sdk-nrf
      revision: v3.2.3
      path: nrf
      remote: nrfconnect
      import:
        name-allowlist:
          - zephyr
          - hal_nordic
          - nrfxlib
          - mbedtls
          - cmsis_6
          - mcuboot
          - oberon-psa-crypto
          - zcbor
