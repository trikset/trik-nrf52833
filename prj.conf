CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_RAW_USB_SELF_POWERED=y
CONFIG_NRFX_GPIOTE_NUM_OF_EVT_HANDLERS=8
CONFIG_UDC_DRIVER=y
# The nRF UDC re-arms the isochronous IN endpoint only on SOF interrupts
# (ev_sof_handler in udc_nrf.c). Without CONFIG_UDC_ENABLE_SOF only the first
# ISO frame is ever transmitted. Telemetry now defaults to BULK (host-paced);
# if the isochronous transport is used again, uncomment this line together
# with CONFIG_RAW_USB_TELEMETRY_ISO at the bottom.
CONFIG_UDC_ENABLE_SOF=y
CONFIG_NRFX_GPIOTE0=y
CONFIG_RAW_USB_MANUFACTURER="trik"
CONFIG_RAW_USB_PRODUCT="periphery-module"
CONFIG_DEBUG_THREAD_INFO=n
CONFIG_THREAD_MONITOR=n
CONFIG_NRFX_SAADC=y
CONFIG_NRFX_GPPI=y
CONFIG_NRFX_TIMER=y
CONFIG_PWM=y
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
CONFIG_BT_LL_SOFTDEVICE_MULTIROLE=y
CONFIG_BT_MAX_CONN=1
# CONFIG_USBD_BT_HCI not set — app uses its own bt_hci_usb.c
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.0.0"
CONFIG_RAW_USB_VERSION="1.0.0"

CONFIG_NRFX_TWIS=y

# Telemetry transport. Default = BULK: snapshots share the BULK IN 0x81
# endpoint with the request/response stream and are paced by the host (pull).
# The isochronous transport (ISO IN 0x88, one snapshot per 1 ms USB frame)
# requires CONFIG_UDC_ENABLE_SOF=y above and is kept commented out for now.
CONFIG_RAW_USB_TELEMETRY_ISO=y

CONFIG_NETWORKING=y
CONFIG_IEEE802154=y
CONFIG_NET_L2_IEEE802154=y
